<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Tracker · SingAlong AI</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    /* ── Job-tracker-specific styles (reuse the shared palette) ── */
    .jobs-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; margin-bottom: 1.25rem; flex-wrap: wrap;
    }
    .jobs-toolbar .left { display: flex; align-items: center; gap: .6rem; }
    .refresh-note { font-size: .8rem; color: var(--text-muted); }
    .back-link {
      display: inline-flex; align-items: center; gap: .35rem;
      font-size: .9rem; font-weight: 500; color: var(--primary);
      text-decoration: none; padding: .5rem .9rem; border-radius: var(--radius);
      border: 1.5px solid var(--border); background: var(--card);
      transition: border-color var(--transition), background var(--transition);
    }
    .back-link:hover { border-color: var(--primary); background: var(--primary-light); }

    .job-list { display: flex; flex-direction: column; gap: 1rem; }
    .job-card {
      background: var(--card); border-radius: var(--radius);
      box-shadow: var(--shadow-sm); border: 1.5px solid var(--border);
      padding: 1.1rem 1.25rem; transition: box-shadow var(--transition);
    }
    .job-card.highlight { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
    .job-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: .75rem; margin-bottom: .6rem; flex-wrap: wrap;
    }
    .job-title { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
    .job-mode-icon { font-size: 1.15rem; }
    .job-id { font-size: .72rem; color: var(--text-muted); font-family: ui-monospace, monospace; }

    .status-pill {
      font-size: .72rem; font-weight: 600; padding: .25rem .6rem;
      border-radius: 999px; text-transform: capitalize; white-space: nowrap;
    }
    .status-pill.queued     { background: #fef3c7; color: var(--accent-dark); }
    .status-pill.processing { background: var(--primary-light); color: var(--primary-dark); }
    .status-pill.done       { background: #d1fae5; color: #047857; }
    .status-pill.error      { background: #fee2e2; color: #b91c1c; }

    .job-bar-wrap {
      height: 8px; background: var(--bg); border-radius: 999px;
      overflow: hidden; margin: .5rem 0 .4rem;
    }
    .job-bar {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--accent));
      border-radius: 999px; width: 0%; transition: width .4s ease;
    }
    .job-bar.done  { background: var(--success); }
    .job-bar.error { background: var(--error); }

    .job-msg { font-size: .85rem; color: var(--text-muted); }
    .job-meta { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .6rem; }
    .job-actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .8rem; }
    .job-actions a, .job-actions button {
      font-size: .82rem; font-weight: 500; padding: .45rem .8rem;
      border-radius: var(--radius); cursor: pointer; text-decoration: none;
      border: 1.5px solid var(--border); background: var(--card); color: var(--text);
      transition: border-color var(--transition), background var(--transition);
    }
    .job-actions a.primary {
      background: var(--primary); border-color: var(--primary); color: #fff;
    }
    .job-actions a:hover, .job-actions button:hover { border-color: var(--primary); }
    .job-time { font-size: .72rem; color: var(--text-muted); margin-top: .5rem; }

    .empty-state {
      text-align: center; color: var(--text-muted); padding: 3rem 1rem;
      background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow-sm);
    }
    .empty-state .big { font-size: 2.5rem; display: block; margin-bottom: .5rem; }
  </style>
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">📋</span>
      <span class="logo-text">Job<span class="logo-ai">Tracker</span></span>
    </div>
    <p class="tagline">Track every generation — come back any time</p>
  </div>
</header>

<main class="container">

  <div class="jobs-toolbar">
    <div class="left">
      <a class="back-link" href="/">← Back to generator</a>
      <span class="refresh-note" id="refreshNote">Auto-refreshing every 3s…</span>
    </div>
    <button class="back-link" id="refreshBtn" type="button">🔄 Refresh now</button>
  </div>

  <div id="jobList" class="job-list">
    <div class="empty-state"><span class="big">⏳</span> Loading jobs…</div>
  </div>

</main>

<footer class="site-footer">
  <p>Powered by <strong>Meta MusicGen</strong> · Hosted on <strong>Azure App Service</strong></p>
</footer>

<script src="/jobs.js"></script>
</body>
</html>
